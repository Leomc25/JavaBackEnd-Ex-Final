spring.application.name=ProyectoBackEnd

# 1. Conexi\u00f3n a nuestra BD sistema_tareas
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_tareas?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=leonardo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Dialecto para MySQL 8 
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 4. Spring Data REST (Punto 8)
# Esto har\u00e1 que tus servicios web empiecen con /api
spring.data.rest.base-path=/api

 
logging.level.org.springframework.web=DEBUG

spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

 